<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Автобазар - Купити та Продати Авто</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        header { background: #003366; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .container { max-width: 1000px; margin: 20px auto; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .price { color: #28a745; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🚗 АВТО БАЗАР УКРАЇНА</h1>
        <p>Купуйте та продавайте автомобілі, запчастини та паливо</p>
    </header>
    <div class="container">
        <h2>Останні оголошення</h2>
        <div class="card">
            <h3>BMW 5 Series, 2019</h3>
            <p>Одеса • 145 тис. км • Дизель</p>
            <div class="price">670 000 ₴</div>
        </div>
        <div class="card">
            <h3>Audi A6, 2018</h3>
            <p>Київ • 115 тис. км • Бензин</p>
            <div class="price">545 000 ₴</div>
        </div>
    </div>
</body>
</html>
