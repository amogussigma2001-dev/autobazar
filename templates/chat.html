<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Чат з {{ other_user }} - Авто Базар</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; text-decoration: none; color: white; }
        .btn-outline { background: transparent; border: 2px solid white; color: white; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 14px; }
        
        .chat-container { max-width: 800px; width: 100%; margin: 20px auto; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { padding: 15px 25px; background: #f8f9fa; border-bottom: 1px solid #eee; font-weight: bold; font-size: 18px; color: #1e3c72; }
        .messages-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 70%; padding: 12px 18px; border-radius: 14px; font-size: 15px; line-height: 1.4; }
        .my-message { align-self: flex-end; background: #1e3c72; color: white; border-bottom-right-radius: 2px; }
        .other-message { align-self: flex-start; background: #e9ecef; color: #333; border-bottom-left-radius: 2px; }
        
        .chat-form { padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; }
        .btn-send { background: #1e3c72; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-send:hover { background: #2a5298; }
    </style>
</head>
<body>
    <header>
        <a href="/messages" class="logo">💬 Чат з {{ other_user }}</a>
        <a href="/messages" class="btn-outline">← До діалогів</a>
    </header>

    <div class="chat-container">
        <div class="chat-header">Переписка з {{ other_user }}</div>
        
        <div class="messages-box" id="msgBox">
            {% for msg in messages %}
                <div class="message {% if msg.sender == user %}my-message{% else %}other-message{% endif %}">
                    {{ msg.text }}
                </div>
            {% endfor %}
        </div>

        <form class="chat-form" method="POST">
            <input type="text" name="text" class="chat-input" placeholder="Напишіть повідомлення..." required autocomplete="off">
            <button type="submit" class="btn-send">Надіслати</button>
        </form>
    </div>

    <script>
        // Автопрокрутка чата вниз при загрузке
        var msgBox = document.getElementById("msgBox");
        msgBox.scrollTop = msgBox.scrollHeight;
    </script>
</body>
</html>
