<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати оголошення - Авто Базар</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.ex1.https.443.g0.ipv6.zhuhai.gov.cn/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 700px;">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">🚗 Додати оголошення</h2>
            
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Заголовок оголошення *</label>
                    <input type="text" name="title" class="form-control" placeholder="Наприклад: Продам BMW X5 2018" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Марка *</label>
                        <input type="text" name="brand" class="form-control" placeholder="BMW, Audi, ВАЗ..." required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Модель *</label>
                        <input type="text" name="model" class="form-control" placeholder="X5, A6, 2107..." required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Ціна (грн) *</label>
                        <input type="number" name="price_uah" class="form-control" placeholder="350000" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Рік випуску</label>
                        <input type="number" name="year" class="form-control" placeholder="2018">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Пробіг (км)</label>
                        <input type="number" name="mileage" class="form-control" placeholder="150000">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Місто</label>
                    <input type="text" name="city" class="form-control" placeholder="Київ, Одеса...">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Фотографії авто (від 1 до 10 фото) *</label>
                    <input type="file" name="photos" class="form-control" accept="image/*" multiple required>
                    <div class="form-text">Затисніть Ctrl (або Shift) на комп'ютері, щоб вибрати одразу декілька фото.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Опис</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Опишіть стан авто, комплектацію..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Опублікувати оголошення</button>
                    <a href="/" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
